name: Build LevelCraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: |
          cd LevelCraftFabric-project
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LevelCraft-jar
          path: LevelCraftFabric-project/build/libs/*.jar
