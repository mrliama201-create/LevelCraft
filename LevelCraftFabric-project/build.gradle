plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
}
version = '1.0.0'
group = 'com.example.levelcraft'
base.archivesName = 'levelcraft'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.166.0+26.3'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
